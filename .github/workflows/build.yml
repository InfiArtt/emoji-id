name: Build and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Pushes to the same branch run one after another, so two quick pushes cannot
# both see a version as unreleased and both try to publish it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Check, test and build
    runs-on: ubuntu-latest
    env:
      # Importing the add-on in tests must not leave __pycache__ folders in addon/
      # for the build to pick up.
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.13 (the version NVDA 2026 uses)
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gettext
          python -m pip install --upgrade pip
          python -m pip install --group build --group test ruff

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        run: python -m pytest

      - name: Check that version numbers match
        run: |
          BUILD_VERSION=$(grep -oP 'addon_version="\K[^"]+' buildVars.py)
          PROJECT_VERSION=$(grep -oP '^version = "\K[^"]+' pyproject.toml)
          if [ "$BUILD_VERSION" != "$PROJECT_VERSION" ]; then
            echo "::error file=pyproject.toml::Version $PROJECT_VERSION does not match addon_version $BUILD_VERSION in buildVars.py"
            exit 1
          fi

      - name: Build add-on and translation template
        run: scons && scons pot

      - name: Check that translations are complete
        run: |
          for po in addon/locale/*/LC_MESSAGES/nvda.po; do
            msgfmt --check --statistics -o /dev/null "$po"
            # Fails when a source string has no translation or the po file is out of date.
            msgcmp "$po" emojiID.pot
          done

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: emojiID-addon
          retention-days: 14
          path: |
            ./*.nvda-addon
            ./*.pot
          if-no-files-found: error

  version-check:
    name: Decide whether to release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      shouldRelease: ${{ steps.meta.outputs.shouldRelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read version, release tag and changelog
        id: meta
        run: |
          VERSION=$(grep -oP 'addon_version="\K[^"]+' buildVars.py || true)
          if [ -z "$VERSION" ]; then
            echo "::error file=buildVars.py::addon_version not found"
            exit 1
          fi
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Exit code 0 means the tag exists, 2 means it does not. Anything else is a
          # failed check, which must not be read as "not released".
          STATUS=0
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null || STATUS=$?
          case "$STATUS" in
            0) echo "shouldRelease=false" >> "$GITHUB_OUTPUT"
               echo "### $TAG is already released, nothing will be published" >> "$GITHUB_STEP_SUMMARY"
               exit 0 ;;
            2) ;;
            *) echo "::error::Could not check whether $TAG exists (git ls-remote exit $STATUS)"
               exit 1 ;;
          esac

          # A release needs a dated changelog section, for example "## [1.1.0] - 2026-11-15".
          # A section marked "belum dirilis" (not released yet) is built but not published.
          if grep -Eq "^## \[$VERSION\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "shouldRelease=true" >> "$GITHUB_OUTPUT"
            echo "### $TAG will be published" >> "$GITHUB_STEP_SUMMARY"
          elif grep -Eq "^## \[$VERSION\]" CHANGELOG.md; then
            echo "shouldRelease=false" >> "$GITHUB_OUTPUT"
            echo "### $TAG is not released yet: give its CHANGELOG.md section a date to publish it" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error file=CHANGELOG.md::No '## [$VERSION]' section in CHANGELOG.md"
            exit 1
          fi

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [build, version-check]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.version-check.outputs.shouldRelease == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: emojiID-addon
          path: .

      - name: Write release notes
        env:
          VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          # The CHANGELOG.md section for this version, without its heading.
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "SHA256 checksum (needed for the NVDA Add-on Store):"
            echo
            echo '```'
            sha256sum ./*.nvda-addon
            echo '```'
          } >> notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version-check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Emoji ID ${{ needs.version-check.outputs.version }}
          body_path: notes.md
          files: |
            ./*.nvda-addon
            ./*.pot
          fail_on_unmatched_files: true
          prerelease: ${{ contains(needs.version-check.outputs.version, '-') }}
          # Never replace a file on a published release: the Add-on Store pins its checksum.
          overwrite_files: false
